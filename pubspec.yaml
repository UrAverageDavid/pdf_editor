name: papertrail
description: A local, pen-first PDF notebook prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  pdfrx: 2.6.5
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/welcome.pdf
